---
- name: Determine master host for K3s API (fallback order)
  set_fact:
    k3s_master_api_host: >-
      {{
        hostvars[groups['masters'][0]].get('k3s_server_ip')
        | default(hostvars[groups['masters'][0]].get('ansible_host'), true)
        | default(hostvars[groups['masters'][0]].get('ansible_default_ipv4', {}).get('address'), true)
      }}

- name: Wait for node-token file on master
  become: true
  delegate_to: "{{ groups['masters'][0] }}"
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 180

- name: Get k3s token from master when missing
  become: true
  delegate_to: "{{ groups['masters'][0] }}"
  command: cat /var/lib/rancher/k3s/server/node-token
  register: token_from_master
  changed_when: false
  when: k3s_token is not defined

- name: Set k3s_token fact on worker
  set_fact:
    k3s_token: "{{ token_from_master.stdout }}"
  when: k3s_token is not defined

- name: Wait for Master API reachable from worker
  wait_for:
    host: "{{ k3s_master_api_host }}"
    port: 6443
    timeout: 180
    delay: 3

- name: Join worker to K3s cluster (idempotent)
  become: true
  shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s-agent
  environment:
    K3S_URL: "https://{{ k3s_master_api_host }}:6443"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: >-
      agent
      --node-name {{ inventory_hostname }}
      --node-label role={{ node_role | default('worker') }}

- name: Ensure k3s-agent service is enabled and started
  become: true
  service:
    name: k3s-agent
    state: started
    enabled: true
