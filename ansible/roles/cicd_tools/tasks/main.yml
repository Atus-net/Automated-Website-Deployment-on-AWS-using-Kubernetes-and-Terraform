---
# =====================================================
# 0) Khởi tạo biến & Kiểm tra tính sẵn sàng
# =====================================================
- name: Ensure cicd_dir has a default value
  ansible.builtin.set_fact:
    cicd_dir: "{{ cicd_dir | default('/opt/cicd') }}"

# =====================================================
# 1) Cài đặt Docker Engine + Compose plugin
# =====================================================
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies for Docker
  become: true
  ansible.builtin.apt:
    name: 
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - unzip
      - lsof

    state: present

- name: Add Docker official GPG key
  become: true
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker Engine + Compose
  become: true
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present

- name: Ensure Docker is enabled and started
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  become: true
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

# =====================================================
# 2) Cấu hình Hệ thống (Yêu cầu bởi SonarQube)
# =====================================================
- name: Set vm.max_map_count for SonarQube (Elasticsearch)
  become: true
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: true

# =====================================================
# 3) Xử lý UID/GID SonarQube (Tránh lỗi phân quyền Volume)
# =====================================================
- name: Pull SonarQube image first
  become: true
  ansible.builtin.command: docker pull sonarqube:lts-community
  changed_when: false # Lệnh này chỉ để đảm bảo image có sẵn

- name: Get SonarQube UID from image
  become: true
  ansible.builtin.command: "docker run --rm sonarqube:lts-community id -u"
  register: sonar_uid_cmd
  changed_when: false

- name: Get SonarQube GID from image
  become: true
  ansible.builtin.command: "docker run --rm sonarqube:lts-community id -g"
  register: sonar_gid_cmd
  changed_when: false

- name: Set SonarQube uid/gid facts (Clean values)
  ansible.builtin.set_fact:
    sonarqube_uid: "{{ sonar_uid_cmd.stdout | trim }}"
    sonarqube_gid: "{{ sonar_gid_cmd.stdout | trim }}"

# =====================================================
# 4) Tạo cấu trúc thư mục & Phân quyền
# =====================================================
- name: Ensure CICD directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ cicd_dir }}", owner: "ubuntu", group: "ubuntu", mode: "0755" }
    - { path: "{{ cicd_dir }}/jenkins_home", owner: "1000", group: "1000", mode: "0775" }
    - { path: "{{ cicd_dir }}/jenkins_casc", owner: "ubuntu", group: "ubuntu", mode: "0755" }
    - { path: "{{ cicd_dir }}/jenkins_init", owner: "ubuntu", group: "ubuntu", mode: "0755" }
    - { path: "{{ cicd_dir }}/sonarqube_data", owner: "{{ sonarqube_uid }}", group: "{{ sonarqube_gid }}", mode: "0775" }
    - { path: "{{ cicd_dir }}/sonarqube_extensions", owner: "{{ sonarqube_uid }}", group: "{{ sonarqube_gid }}", mode: "0775" }
    - { path: "{{ cicd_dir }}/sonarqube_logs", owner: "{{ sonarqube_uid }}", group: "{{ sonarqube_gid }}", mode: "0775" }

# =====================================================
# 5) Kubeconfig cho Jenkins (Phục vụ Deploy lên K3s)
# =====================================================
- name: Ensure Jenkins .kube directory exists
  become: true
  ansible.builtin.file:
    path: "{{ cicd_dir }}/jenkins_home/.kube"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Read kubeconfig from master node
  become: true
  ansible.builtin.slurp:
    src: "/etc/rancher/k3s/k3s.yaml"
  delegate_to: "{{ groups['masters'][0] }}"
  register: kubeconfig_raw

- name: Write kubeconfig into Jenkins volume
  become: true
  ansible.builtin.copy:
    dest: "{{ cicd_dir }}/jenkins_home/.kube/config"
    content: "{{ kubeconfig_raw.content | b64decode }}"
    owner: "1000"
    group: "1000"
    mode: "0600"

- name: Update Kubeconfig Server IP to Master Public IP
  become: true
  ansible.builtin.replace:
    path: "{{ cicd_dir }}/jenkins_home/.kube/config"
    regexp: '127\.0\.0\.1'
    replace: "{{ hostvars[groups['masters'][0]].ansible_host }}"

# =====================================================
# 6) Pre-install Sonar Scanner (Bypass lỗi Unpacking)
# =====================================================
- name: Unarchive Sonar Scanner CLI to Jenkins volume
  become: true
  ansible.builtin.unarchive:
    src: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
    dest: "{{ cicd_dir }}/jenkins_home"
    remote_src: yes
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Setup Sonar Scanner directory path
  become: true
  ansible.builtin.shell: |
    rm -rf {{ cicd_dir }}/jenkins_home/sonar-scanner
    mv {{ cicd_dir }}/jenkins_home/sonar-scanner-5.0.1.3006-linux {{ cicd_dir }}/jenkins_home/sonar-scanner
  args:
    creates: "{{ cicd_dir }}/jenkins_home/sonar-scanner"

# =====================================================
# 7) Render Cấu hình & Khởi chạy Docker Compose
# =====================================================

# Sử dụng module 'template' cho các tệp .j2 (Ansible sẽ tìm trong thư mục templates/)
- name: Render CI/CD Templates (.j2 files)
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cicd_dir }}/{{ item.dest }}"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  loop:
    - { src: 'docker-compose.yml.j2', dest: 'docker-compose.yml' }
    - { src: 'jenkins.yaml.j2', dest: 'jenkins_casc/jenkins.yaml' }

# Sử dụng module 'copy' cho các tệp tĩnh (Ansible sẽ tìm trong thư mục files/ như trong ảnh a0dfda.png)
- name: Copy Static CI/CD Files (Groovy & Plugins)
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ cicd_dir }}/{{ item.dest }}"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  loop:
    - { src: 'init-credentials.groovy', dest: 'jenkins_init/01-init-credentials.groovy' }
    - { src: 'plugins.txt', dest: 'plugins.txt' }

- name: Start Jenkins + SonarQube Stack
  become: true
  shell: cd "{{ cicd_dir }}" && docker compose up -d
# =====================================================
# 8) KÍCH HOẠT CÀI PLUGIN (Fix lỗi Jenkins trống plugin)
# =====================================================
- name: Wait for Jenkins to initialize
  ansible.builtin.pause:
    seconds: 45

- name: Trigger plugin installation via Jenkins CLI
  become: true
  ansible.builtin.shell: |
    docker exec -u root jenkins jenkins-plugin-cli --plugin-file /usr/share/jenkins/ref/plugins.txt
  register: plugin_install_out
  failed_when: false

- name: Restart Jenkins to finalize plugin activation
  become: true
  ansible.builtin.shell: "docker restart jenkins"
  when: "'Installing' in plugin_install_out.stdout"

# =====================================================
# 9) Cài đặt Trivy (Security Scanning)
# =====================================================
- name: Install Trivy Security Scanner
  become: true
  ansible.builtin.shell: |
    wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | tee /usr/share/keyrings/trivy.gpg > /dev/null
    echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main" | tee /etc/apt/sources.list.d/trivy.list
    apt-get update && apt-get install trivy -y