---
- name: Update apt cache
  become: true
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required system packages
  become: true
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - python3-venv
      - unzip
    state: present

- name: Upgrade pip (recommended)
  become: true
  pip:
    name: pip
    state: latest
    executable: pip3

- name: Install Kubernetes Python library for Ansible
  become: true
  pip:
    name: kubernetes
    state: present
    executable: pip3

- name: Disable UFW firewall (lab-friendly)
  become: true
  ufw:
    state: disabled
  ignore_errors: true
