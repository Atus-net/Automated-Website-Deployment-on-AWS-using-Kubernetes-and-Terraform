---
# -------------------------------------------------------
# INFRA: namespaces + ingress-nginx + shared services
# Jenkins is NOT deployed in k8s (runs on EC2 devops_node)
# -------------------------------------------------------

- name: Remove default Traefik (optional safety)
  shell: |
    kubectl -n kube-system delete service traefik --ignore-not-found
    kubectl -n kube-system delete deployment traefik --ignore-not-found
    kubectl -n kube-system delete job helm-install-traefik --ignore-not-found
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  tags: [infra]

- name: Ensure namespaces exist
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/etc/rancher/k3s/k3s.yaml"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop:
    - ingress-nginx
    - k3s-app
  tags: [infra]

- name: Deploy ingress-nginx (custom manifest)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/etc/rancher/k3s/k3s.yaml"
    definition: "{{ lookup('file', playbook_dir + '/../k8s/base/nginx-custom.yaml') }}"
  tags: [infra]

- name: Wait for ingress-nginx controller to be ready
  shell: kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: rollout
  changed_when: false
  failed_when: rollout.rc != 0
  tags: [infra]

- name: Deploy MongoDB + Services + Ingress
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/etc/rancher/k3s/k3s.yaml"
    namespace: k3s-app
    definition: "{{ lookup('file', item) }}"
  loop:
    - "{{ playbook_dir }}/../k8s/base/mongo-db.yaml"
    - "{{ playbook_dir }}/../k8s/base/backend-service.yaml"
    - "{{ playbook_dir }}/../k8s/base/frontend-service.yaml"
    - "{{ playbook_dir }}/../k8s/base/ingress.yaml"
  tags: [infra]
