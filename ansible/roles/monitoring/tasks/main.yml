---
# 1. Cài đặt Helm trên Master nếu chưa có
- name: Install Helm on master if missing
  become: true
  shell: |
    set -e
    if ! command -v helm >/dev/null 2>&1; then
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    fi
  args:
    creates: /usr/local/bin/helm
  tags: [monitoring]

# 2. Dọn dẹp tài nguyên cũ (Tránh lỗi Ownership Metadata)
- name: Force cleanup of existing non-Helm ingress resources
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  shell: |
    kubectl delete clusterrole ingress-nginx --ignore-not-found
    kubectl delete clusterrolebinding ingress-nginx --ignore-not-found
    kubectl delete ingressclass nginx --ignore-not-found
    if kubectl get ns ingress-nginx >/dev/null 2>&1; then
      kubectl delete namespace ingress-nginx --wait=true
    fi
  ignore_errors: yes
  tags: [monitoring]

# 3. Đảm bảo Namespace cho Monitoring tồn tại
- name: Ensure monitoring namespace exists
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_namespace }}"
  tags: [monitoring]

# 4. Thêm các Helm Repo (Đã sửa lỗi become_timeout)
- name: Add Helm repos
  become: true
  shell: |
    set -e
    helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    helm repo update
  tags: [monitoring]

# 5. Cài đặt Ingress Controller (Cổng 30080)
- name: Install/Upgrade ingress-nginx controller
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  shell: |
    set -e
    helm upgrade --install {{ ingress_nginx_release_name }} ingress-nginx/ingress-nginx \
      --namespace ingress-nginx --create-namespace \
      --set controller.service.type=NodePort \
      --set controller.service.nodePorts.http=30080
  register: nginx_helm_out
  changed_when: "'installed' in nginx_helm_out.stdout or 'upgraded' in nginx_helm_out.stdout"
  tags: [monitoring]

# 6. Cài đặt Kube-Prometheus-Stack
- name: Install/Upgrade kube-prometheus-stack
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  shell: |
    set -e
    helm upgrade --install {{ monitoring_release_name }} prometheus-community/kube-prometheus-stack \
      --namespace {{ monitoring_namespace }} \
      --set grafana.adminPassword={{ grafana_admin_password | quote }} \
      --set grafana.service.type=ClusterIP \
      --set prometheus.service.type=ClusterIP
  register: monitoring_helm_out
  changed_when: "'installed' in monitoring_helm_out.stdout or 'upgraded' in monitoring_helm_out.stdout"
  tags: [monitoring]

# 7. Tạo Ingress cho các công cụ giám sát
- name: Create Ingress objects for Monitoring
  when: monitoring_enable_ingress | bool
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) }}"
  loop:
    - grafana-ingress.yml.j2
    - prometheus-ingress.yml.j2
  tags: [monitoring]