---
# =======================================================
# Stage A: Base OS prerequisites (all nodes)
# =======================================================
- name: "SETUP: Base packages (all nodes)"
  hosts: all
  become: yes
  tags: [setup]
  roles:
    - k3s_setup

# =======================================================
# Stage B: K3s cluster
# =======================================================
- name: "K3S: Install Master"
  hosts: masters
  become: yes
  tags: [k3s]
  roles:
    - k3s_master

- name: "K3S: Join Workers"
  hosts: workers
  become: yes
  tags: [k3s]
  roles:
    - k3s_worker

# =======================================================
# Stage C: Kubeconfig
# - master: local kubectl config
# - devops: put kubeconfig into Jenkins volume (docker compose)
# =======================================================
- name: "CONFIG: kubeconfig on master"
  hosts: masters
  become: yes
  tags: [config]
  tasks:
    - name: Ensure .kube exists
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy kubeconfig
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Replace localhost with master public IP
      replace:
        path: /home/ubuntu/.kube/config
        regexp: '127\.0\.0\.1'
        replace: "{{ ansible_host }}"

- name: "CONFIG: Put kubeconfig into Jenkins volume on DevOps node"
  hosts: devops
  become: yes
  tags: [config, devops]
  vars:
    cicd_dir: "{{ cicd_dir | default('/opt/cicd') }}"
  tasks:
    - name: Ensure Jenkins kubeconfig directory exists in jenkins_home volume
      file:
        path: "{{ cicd_dir }}/jenkins_home/.kube"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Fetch kubeconfig from master to controller
      slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ groups['masters'][0] }}"
      register: kubeconfig_raw

    - name: Write kubeconfig into Jenkins volume
      copy:
        dest: "{{ cicd_dir }}/jenkins_home/.kube/config"
        content: "{{ kubeconfig_raw.content | b64decode }}"
        owner: "1000"
        group: "1000"
        mode: "0644"

    - name: Replace localhost with master public IP in Jenkins kubeconfig
      replace:
        path: "{{ cicd_dir }}/jenkins_home/.kube/config"
        regexp: '127\.0\.0\.1'
        replace: "{{ hostvars[groups['masters'][0]].ansible_host }}"

# =======================================================
# Stage D: CI/CD tools (DevOps node)
# Jenkins + SonarQube + Trivy (DockerHub creds managed in Jenkins UI)
# =======================================================
- name: "CICD: Jenkins + SonarQube + Trivy (DevOps node)"
  hosts: devops
  become: yes
  tags: [cicd]
  roles:
    - cicd_tools

# =======================================================
# Stage E: Monitoring (Master)
# Install ingress-nginx + kube-prometheus-stack via Helm
# =======================================================
- name: "MONITORING: Prometheus + Grafana (Master)"
  hosts: masters
  become: yes
  tags: [monitoring, monitor]
  roles:
    - monitoring

# =======================================================
# Stage F: Optional labels (demo scheduling)
# =======================================================
- name: "LABEL: Label worker nodes (optional)"
  hosts: masters
  become: yes
  tags: [label]
  tasks:
    - name: Ensure jq is installed on master (required for labeling)
      apt:
        name: jq
        state: present
        update_cache: yes

    - name: Gather facts from workers
      setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['workers'] | default([]) }}"
      when: groups['workers'] is defined and (groups['workers'] | length > 0)

    - name: Apply labels role=<node_role>
      shell: |
        set -e
        INTERNAL_IP="{{ hostvars[item].ansible_default_ipv4.address | default('') }}"
        ROLE="{{ hostvars[item].node_role | default('worker') }}"
        NODE_NAME=""

        if [ -n "$INTERNAL_IP" ]; then
          NODE_NAME=$(kubectl get nodes -o json | jq -r --arg ip "$INTERNAL_IP" \
            '.items[] | select(.status.addresses[]? | select(.type=="InternalIP" and .address==$ip)) | .metadata.name' | head -n1)
        fi

        if [ -z "$NODE_NAME" ]; then
          NODE_NAME="{{ item }}"
        fi

        kubectl label nodes "$NODE_NAME" role="$ROLE" --overwrite
      args:
        executable: /bin/bash
      loop: "{{ groups['workers'] | default([]) }}"
      when: groups['workers'] is defined and (groups['workers'] | length > 0)
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      ignore_errors: true
